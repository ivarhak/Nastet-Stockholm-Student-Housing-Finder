name: Publish dashboard

# Scrapes on a schedule and publishes the result as a static site on GitHub
# Pages. The dashboard is the same file the local Flask version serves — it just
# reads listings.json instead of /api/listings when no server answers, so there
# is one UI to maintain rather than two.
#
# Pages is turned on by the configure-pages step below, so there's no Settings
# toggle to remember. This is the ONLY workflow that should deploy to Pages —
# a second one would fight it, since every deploy replaces the whole site.

on:
  schedule:
    # Every two hours. Deliberately at :17 rather than :00 — GitHub's scheduler
    # is busiest on the hour and delays runs that pile up there.
    - cron: '17 */2 * * *'
  workflow_dispatch:      # lets you publish on demand from the Actions tab
  push:
    branches: [main]
    # Republish when the UI itself changes, without waiting for the next scrape.
    paths:
      - 'index.html'
      - 'sw.js'
      - 'manifest.webmanifest'
      - 'icon-*.png'
      - '.github/workflows/publish.yml'

permissions:
  contents: read
  pages: write
  id-token: write

# Never let two publishes race. Not cancel-in-progress: a half-finished deploy
# is worse than a slightly late one.
concurrency:
  group: pages
  cancel-in-progress: false

env:
  # Kept in step with the cron above; the dashboard prints it so the page can
  # say how often it updates without hardcoding the number in two places.
  UPDATE_EVERY_HOURS: '2'
  # Where the site actually lives, for canonical/Open Graph/sitemap URLs. The
  # workflow can't discover the Pages custom domain on its own, so it's written
  # down once here — change it here if the domain ever moves.
  #
  # Punycode, not nästet.se: sitemaps.org requires ASCII URLs, and it's the form
  # GitHub Pages stores a custom IDN domain under. Browsers and search engines
  # both display it back to a reader as nästet.se, so nobody sees this spelling.
  # Note nastet.se WITHOUT the a-umlaut is a different owner's domain entirely —
  # pointing canonical at it would hand them this site's search identity.
  SITE_URL: 'https://xn--nstet-gra.se'

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip

      - run: pip install -r requirements.txt

      - name: Show Chrome version
        # SSSB's vacancy list is a JS shell, so the scrape falls back to Selenium
        # and needs a real browser. ubuntu-latest ships Chrome; print it so a
        # runner image change that drops it is obvious in the log.
        run: google-chrome --version || chromium --version

      # Two caches worth keeping between runs, both restored under one key:
      #  · bike_route_cache.json — 26 areas x 7 campuses of real cycling routes
      #    from a free community Valhalla instance. Cold, that's ~180 paced
      #    requests taking ~2.5 min. The areas never move, so re-fetching them
      #    every two hours would be rude and pointless.
      #  · current_listings_*.json — the previous run's listings, one file per
      #    city, which is what new-listing diffing compares against. Without them
      #    every run would mark all ~170 listings as NEW, since the runner starts
      #    empty each time.
      #  · address_cache.json — the ~43 building addresses behind the per-listing
      #    map dots. Nominatim asks for 1 req/sec and no bulk geocoding; without
      #    this the runner would re-look-up all of them every two hours, which
      #    would be exactly the abuse that policy is about.
      #  · geocode_cache.json — area and campus coordinates. The committed copy
      #    covers Stockholm, but a city added since then has areas and campuses
      #    that aren't in it, and without this the runner would re-resolve every
      #    one of them on every run — ~28 lookups twelve times a day, at
      #    Nominatim's 1 req/sec, for coordinates that never move. The real fix
      #    is committing the file once a city's pins are checked; this is the
      #    safety net for the window before that.
      #  · grocery_cache.json / grocery_cache_*.json — the chain supermarkets, one
      #    file per city (grocery_cache.json is specifically Stockholm's — see
      #    grocery_cache_file() in monitor.py). Left out of this list at first,
      #    which meant every publish threw the list away and re-asked Overpass
      #    from scratch: 12 full queries a day to a free community service, and a
      #    map with no shop dots whenever one of them was busy. Each file has a
      #    30-day expiry of its own, so caching it here doesn't freeze the data —
      #    it just stops us asking twelve times a day for an answer that changes
      #    about once a year.
      - name: Restore scrape caches
        uses: actions/cache/restore@v4
        with:
          path: |
            data/bike_route_cache.json
            data/current_listings.json
            data/current_listings_*.json
            data/address_cache.json
            data/geocode_cache.json
            data/grocery_cache.json
            data/grocery_cache_*.json
          key: nastet-scrape-cache-
          # Two prefixes, newest match wins. The second is the pre-rebrand key:
          # without it the first run after the rename starts from an empty
          # cache, which means every listing reads as NEW and ~180 Valhalla
          # routes plus 40-odd Nominatim lookups get re-fetched from cold.
          # Safe to drop once a run has saved under the new prefix.
          restore-keys: |
            nastet-scrape-cache-
            sshf-scrape-cache-

      - name: Scrape SSSB + Bostadsförmedlingen
        # Fails the job on a scrape error, on purpose: Pages keeps serving the
        # previous deployment, which is much better than publishing an empty map.
        #
        # A push that only touched the dashboard doesn't need fresh listings — it
        # needs the new UI deployed against the listings we already have. Hitting
        # SSSB again for that would be a scrape nobody asked for.
        run: |
          if [ "${{ github.event_name }}" = "push" ] && ls data/current_listings_*.json >/dev/null 2>&1; then
            echo "UI-only push, and the cache already has listings — redeploying without scraping."
          else
            python monitor.py --once
          fi

      - name: Assemble the site
        # One payload file per city, plus the small index the picker reads. The
        # page only ever fetches the city it is showing, so adding cities doesn't
        # grow what a visitor downloads.
        run: |
          mkdir -p _site
          cp index.html _site/index.html
          # The watch's notifications go through sw.js, and on iOS the site has
          # to be installable as a Home Screen web app before it may show one at
          # all — which is what the manifest and the PNG icons are for. Missing
          # any of these turns the feature off silently on a phone, so the build
          # fails rather than publishes a page that quietly can't notify.
          cp sw.js manifest.webmanifest icon-180.png icon-192.png icon-512.png _site/
          python - <<'PY'
          import html, json, os, pathlib, sys
          sys.path.insert(0, ".")
          from monitor import CITIES, DEFAULT_CITY, listings_file

          every = int(os.environ["UPDATE_EVERY_HOURS"])
          index, published = {}, 0
          for cid, conf in CITIES.items():
              if not conf.get("enabled", True):
                  # Registered but not verified yet — see the registry comment.
                  print(f"{cid}: not enabled — skipped")
                  continue
              path = listings_file(cid)
              if not path.exists():
                  # A city whose scrape has never succeeded is left out of the
                  # index entirely rather than offered as an empty option.
                  print(f"{cid}: no data file — skipped")
                  continue
              data = json.loads(path.read_text())
              # Lets the page say "updates every N hours" without the number
              # being written down twice.
              data["update_every_hours"] = every
              pathlib.Path(f"_site/listings-{cid}.json").write_text(
                  json.dumps(data, ensure_ascii=False))
              published += 1
              by = {}
              for l in data["listings"]:
                  by[l["provider"]] = by.get(l["provider"], 0) + 1
              # Printed from the payload actually being deployed, not from the
              # scrape's own report — the last word on what the page will show.
              # A run that quietly shipped zero shops used to look exactly like
              # a healthy one from here.
              shops = len(data.get("groceries") or [])
              print(f"{cid}: {len(data['listings'])} listings {by} · "
                    f"shops: {shops}{' — Shops toggle hidden' if not shops else ''} · "
                    f"generated_at {data['generated_at']} · "
                    f"new this run: {len(data.get('new_listing_ids') or [])}")
              # A city whose sources refused publishes anyway — the dashboard now
              # says so on the page, and holding back the whole deploy would stop
              # the *working* cities updating too. But it must not read as a
              # normal green build: this is the same lesson as the run that
              # quietly shipped zero shops. ::warning:: puts it on the run page
              # and into the notification email.
              for n in data.get("source_notes") or []:
                  print(f"::warning title={cid}: source failed::"
                        f"{n.get('source')} {n.get('detail')}")
              index[cid] = {"name": conf["name"], "providers": conf["providers"],
                            "listings": len(data["listings"]),
                            "generated_at": data["generated_at"]}
          if not published:
              raise SystemExit("no city produced a payload — refusing to publish an empty site")
          pathlib.Path("_site/cities.json").write_text(json.dumps(
              {"default": DEFAULT_CITY, "cities": index}, ensure_ascii=False))
          print(f"publishing {published} city/cities: {', '.join(index)}")

          # ── What a search engine, and a pasted link, actually see ──────────
          # The dashboard is a JS app: until listings-<city>.json arrives its
          # <body> is an empty shell, so the only prose in the source is the
          # QUEUES TO JOIN panel — and none of it was described anywhere. These
          # are built here rather than written into index.html by hand because
          # the counts are only true at the moment the site is assembled.
          site = (os.environ.get("SITE_URL") or "").rstrip("/")
          if not site:
              raise SystemExit("SITE_URL is empty — canonical and sitemap URLs need it")
          total = sum(c["listings"] for c in index.values())
          names = [c["name"] for c in index.values()]
          where = names[0] if len(names) == 1 else f"{', '.join(names[:-1])} and {names[-1]}"
          providers = sorted({p for c in index.values() for p in c["providers"]})
          desc = (f"{total} student homes available right now in {where}, from "
                  f"{', '.join(providers)} — queue days, rent and the commute to "
                  f"your campus, on one map.")

          def attr(s):
              return html.escape(s, quote=True)

          ld = {"@context": "https://schema.org", "@type": "WebApplication",
                "name": "Nästet", "url": f"{site}/", "description": desc,
                "applicationCategory": "BrowserApplication",
                "operatingSystem": "Any", "isAccessibleForFree": True,
                "inLanguage": "en", "areaServed": names}

          head = (
              f'<meta name="description" content="{attr(desc)}" />\n'
              f'<link rel="canonical" href="{site}/" />\n'
              '<meta property="og:type" content="website" />\n'
              '<meta property="og:site_name" content="Nästet" />\n'
              '<meta property="og:title" content="Nästet — student housing in Sweden" />\n'
              f'<meta property="og:description" content="{attr(desc)}" />\n'
              f'<meta property="og:url" content="{site}/" />\n'
              f'<link rel="alternate" hreflang="en" href="{site}/" />\n'
              f'<link rel="alternate" hreflang="sv" href="{site}/?lang=sv" />\n'
              f'<link rel="alternate" hreflang="x-default" href="{site}/" />\n'
              '<meta name="twitter:card" content="summary" />\n'
              '<script type="application/ld+json">'
              f'{json.dumps(ld, ensure_ascii=False)}</script>\n')

          page = pathlib.Path("_site/index.html")
          src = page.read_text()
          if "</head>" not in src:
              raise SystemExit("index.html has no </head> to inject metadata into")
          page.write_text(src.replace("</head>", head + "</head>", 1))
          print(f"page description: {desc}")

          # Cities are URL *fragments* (…/#lund), not separate documents, so
          # there is exactly one canonical URL to list. A sitemap naming #lund
          # would be submitting the same page three times.
          newest = max((c["generated_at"] or "" for c in index.values()), default="")
          lastmod = f"<lastmod>{newest[:10]}</lastmod>" if newest[:10] else ""
          pathlib.Path("_site/robots.txt").write_text(
              f"User-agent: *\nAllow: /\nSitemap: {site}/sitemap.xml\n")
          pathlib.Path("_site/sitemap.xml").write_text(
              '<?xml version="1.0" encoding="UTF-8"?>\n'
              '<urlset xmlns="http://www.sitemaps.org/schemas/sitemap/0.9">\n'
              f'  <url><loc>{site}/</loc>{lastmod}</url>\n'
              '</urlset>\n')
          print(f"robots.txt + sitemap.xml written for {site}")
          PY

      - name: Save scrape caches
        # Always a fresh key so the newest listings become the next run's
        # comparison point; restore-keys above picks up whichever is latest.
        if: always()
        # A cache hiccup must never turn an otherwise good publish into a failure.
        continue-on-error: true
        uses: actions/cache/save@v4
        with:
          path: |
            data/bike_route_cache.json
            data/current_listings.json
            data/current_listings_*.json
            data/address_cache.json
            data/geocode_cache.json
            data/grocery_cache.json
            data/grocery_cache_*.json
          key: nastet-scrape-cache-${{ github.run_id }}

      - name: Configure Pages
        # This is what enables Pages with "GitHub Actions" as the source, so the
        # deploy below doesn't need anyone to have flipped that setting by hand
        # first — which is exactly what was failing before.
        uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
